[platformio]
src_dir = .
default_envs = hw364a

[env:hw364a]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = olikraus/U8g2@^2.35.30
build_flags = -Wall

; Same firmware plus a synthetic-frame self-test that runs once at boot and
; reports over serial. Not part of default_envs, so it is never what ships.
[env:hw364a-selftest]
extends = env:hw364a
build_flags = -Wall -D SELFTEST_FRAMES
